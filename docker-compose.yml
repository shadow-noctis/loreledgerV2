services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - PYTHONPATH=/backend
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - /backend/.venv
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend

  database:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loreadmin -d loreledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: ["5432:5432"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PYTHONPATH=/backend
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql